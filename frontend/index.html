<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OS Tracker</title>
    <script>
      // Applied before React mounts so there is no flash of the wrong theme.
      // localStorage is only a cache here - the server value on users.preferences
      // is the source of truth and wins once /auth/me resolves.
      (function () {
        try {
          var stored = localStorage.getItem('os-tracker.theme') || 'system';
          var dark =
            stored === 'dark' ||
            (stored === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
          var density = localStorage.getItem('os-tracker.density') || 'comfortable';
          document.documentElement.setAttribute('data-density', density);
        } catch (e) {
          document.documentElement.setAttribute('data-bs-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
